<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Faybi SN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: outil de facturation pour freelances — barre latérale fixe + espace de travail ; la facture s'affiche comme une feuille A4 */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --sunk:#E7ECE9; --ink:#13231E; --muted:#5A6B65; --line:#D6DED9;
  --accent:#0A6B53; --accent-ink:#FFFFFF; --accent-soft:#D8ECE4;
  --good:#1D7A3E; --good-soft:#DFF1E5; --warn:#9A5A00; --warn-soft:#FAEAD2;
  --bad:#B42B22; --bad-soft:#F8E0DC; --info:#2C5A9E; --info-soft:#E0E9F6;
  --paper:#FFFFFF; --paper-line:#E3E9E5;
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1311; --surface:#141D1A; --sunk:#1B2622; --ink:#E3EBE7; --muted:#93A39D; --line:#27342F;
  --accent:#3CC198; --accent-ink:#04231A; --accent-soft:#163A30;
  --good:#5CCB7E; --good-soft:#15301F; --warn:#E8A84A; --warn-soft:#37280F;
  --bad:#F2766C; --bad-soft:#3A1B18; --info:#86AEEA; --info-soft:#18283F;
  --paper:#17211E; --paper-line:#26332E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1311; --surface:#141D1A; --sunk:#1B2622; --ink:#E3EBE7; --muted:#93A39D; --line:#27342F;
  --accent:#3CC198; --accent-ink:#04231A; --accent-soft:#163A30;
  --good:#5CCB7E; --good-soft:#15301F; --warn:#E8A84A; --warn-soft:#37280F;
  --bad:#F2766C; --bad-soft:#3A1B18; --info:#86AEEA; --info-soft:#18283F;
  --paper:#17211E; --paper-line:#26332E; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:28px;letter-spacing:-.01em}
h2{font-size:18px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
small{font-size:12.5px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:22px;
  padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;
  background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center}
.brand .mark{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font:700 15px var(--f-display)}
.brand b{font-family:var(--f-display);font-size:18px;display:block;line-height:1.1}
.brand small{color:var(--muted)}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap}
nav button:hover{background:var(--sunk);color:var(--ink)}
nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
nav button:focus-visible{outline:2px solid var(--accent)}
.side-cta{display:flex;flex-direction:column;gap:8px;margin-top:auto}

main{min-width:0;width:100%;max-width:1140px;padding-block:30px 72px;
  padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.head{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end;justify-content:space-between;margin-bottom:22px}
.head p{margin:4px 0 0;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;
  padding:8px 14px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:13.5px}

.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  background:var(--info-soft);color:var(--ink);border-radius:10px;padding:10px 14px;margin-bottom:20px;font-size:14px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .val{font:500 22px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .val small{font-size:12px;color:var(--muted)}
.kpi .val.neg{color:var(--bad)}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.kpi.bad{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.kpi.bad .val{color:var(--bad)}

.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card h2{margin-bottom:14px}

.chartwrap{position:relative;padding-left:52px}
.chart{position:relative;height:190px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;border-bottom:1px solid var(--line)}
.gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line);pointer-events:none}
.gl span{position:absolute;left:-52px;top:-9px;width:46px;text-align:right;font:11.5px var(--f-mono);color:var(--muted)}
.col{display:flex;gap:4px;align-items:end;justify-content:center;height:100%;position:relative;z-index:1}
.bar{width:min(20px,42%);border-radius:4px 4px 0 0;background:var(--accent);min-height:1px}
.bar.f{background:var(--accent-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent)}
.xl{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:6px;font-size:12.5px;color:var(--muted);text-align:center}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.goal .bigline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.goal .bigline b{font:500 24px var(--f-mono);font-variant-numeric:tabular-nums}
.goal .track{height:12px;border-radius:99px;background:var(--sunk);overflow:hidden;margin:12px 0 8px}
.goal .track i{display:block;height:100%;background:var(--accent);border-radius:99px}

.plist{display:flex;flex-direction:column}
.pitem{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.pitem:first-child{border-top:0;padding-top:0}
.pitem .who{min-width:0}
.pitem .who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .who small{color:var(--muted)}
.empty{color:var(--muted);padding:18px 0;text-align:center}

.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--sunk);color:var(--ink)}
.pill.muted{background:var(--sunk);color:var(--muted)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;color:var(--muted)}
.chip b{font-family:var(--f-mono);font-weight:500;margin-left:4px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.search{min-width:0;flex:0 1 260px}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table.list{width:100%;border-collapse:collapse;font-size:14.5px}
table.list th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list th.num{text-align:right}
table.list td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr:last-child td{border-bottom:0}
table.list tbody tr[data-act]{cursor:pointer}
table.list tbody tr[data-act]:hover{background:var(--sunk)}
td.cl{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

label.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted);min-width:0}
input[type=text],input[type=date],input[type=search],input[type=email],input[type=tel],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink);font-size:15px;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
input[type=file]{font-size:14px;color:var(--muted);max-width:100%}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.check{display:flex;gap:8px;align-items:center;font-weight:500;color:var(--ink);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:9px 12px;font-weight:500}

.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 84px 150px 130px 36px;gap:8px;align-items:center}
.line.h{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.line.h span:nth-child(n+2){text-align:right}
.line input{text-align:right}
.line input.desc{text-align:left}
.line .amt{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.x{appearance:none;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;border-radius:6px;height:36px}
.x:hover{background:var(--bad-soft);color:var(--bad)}
.editfoot{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.tot{display:flex;flex-direction:column;gap:6px;background:var(--sunk);border-radius:10px;padding:14px 16px}
.tot div{display:flex;justify-content:space-between;gap:10px}
.tot div span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tot .big{font-weight:600;font-size:17px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.tot .dep{color:var(--accent);font-weight:500}

.actions{display:flex;flex-wrap:wrap;gap:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel.alert{border-color:var(--bad);background:var(--bad-soft)}
.relmsg{font-family:var(--f-body);font-size:14.5px;min-height:120px}

.cats{display:flex;flex-direction:column;gap:10px}
.cat{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.cat .track{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.cat .track i{display:block;height:100%;background:var(--accent);border-radius:99px}
.thumb{max-width:160px;max-height:160px;border-radius:8px;border:1px solid var(--line);display:block}
.deadline{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.deadline:first-of-type{border-top:0;padding-top:0}
.deadline .day{flex:none;width:54px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:5px 0;line-height:1.1}
.deadline .day b{display:block;font:700 20px var(--f-display)}
.deadline .day small{color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.06em}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}

/* La feuille de facture */
.paper{background:var(--paper);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 32px -18px rgba(10,60,45,.25);
  padding:40px 44px;max-width:860px;color:var(--ink);font-size:14px}
.p-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:24px;padding-bottom:22px;border-bottom:2px solid var(--accent)}
.p-co b{font-family:var(--f-display);font-size:20px;display:block}
.p-co .job{color:var(--accent);font-weight:500;margin-bottom:6px}
.p-co div,.p-cl div{color:var(--muted);font-size:13px;line-height:1.55}
.p-title{text-align:right}
.p-title h3{font-size:30px;letter-spacing:.14em;color:var(--accent)}
.p-title dl{display:grid;grid-template-columns:auto auto;gap:2px 14px;margin:10px 0 0;font-size:13px;justify-content:end}
.p-title dt{color:var(--muted);text-align:right}
.p-title dd{margin:0;font-family:var(--f-mono);text-align:right}
.p-mid{display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px;padding:22px 0}
.p-cl .lbl,.p-sec .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:6px}
.p-cl b{font-size:16px;display:block;margin-bottom:2px}
.p-tablewrap{overflow-x:auto}
table.p-lines{width:100%;border-collapse:collapse;min-width:480px}
table.p-lines th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;background:var(--sunk);font-weight:600}
table.p-lines th.num{text-align:right}
table.p-lines td{padding:10px;border-bottom:1px solid var(--paper-line)}
.p-sum{display:flex;justify-content:flex-end;margin-top:16px}
.p-sum dl{display:grid;grid-template-columns:auto auto;gap:6px 28px;margin:0;min-width:300px}
.p-sum dt{color:var(--muted)}
.p-sum dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.p-sum .ttc{font-weight:600;color:var(--ink);font-size:16px;border-top:1px solid var(--line);padding-top:8px}
.p-sum .due{color:var(--accent);font-weight:600}
.p-words{margin-top:22px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--sunk);font-size:13.5px}
.p-foot{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:24px;padding-top:18px;border-top:1px solid var(--paper-line);font-size:13px}
.p-foot ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.stamp{display:inline-block;margin-top:8px;border:2px solid var(--good);color:var(--good);font:700 13px var(--f-display);letter-spacing:.14em;padding:4px 10px;border-radius:6px;transform:rotate(-4deg)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-weight:500;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}

@media (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px;border-right:0;border-bottom:1px solid var(--line);
    padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .side-cta{flex-direction:row;margin:0 0 0 auto}
  .side-cta .btn.alt{display:none}
  nav{order:3;flex-direction:row;width:100%;overflow-x:auto}
  main{padding-block:22px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hide-sm{display:none}
  .editfoot{grid-template-columns:minmax(0,1fr)}
  .line{grid-template-columns:70px minmax(0,1fr) minmax(0,1fr) 36px}
  .line .desc{grid-column:1 / -1}
  .line .amt{display:none}
  .line.h{display:none}
  .lines .line{padding-bottom:10px;border-bottom:1px dashed var(--line)}
  .paper{padding:24px 18px}
  .p-title{text-align:left}
  .p-title dl{justify-content:start}
  .p-title dt,.p-title dd{text-align:left}
  .p-sum dl{min-width:0;width:100%}
}
@media (max-width:440px){.kpis{grid-template-columns:minmax(0,1fr)}h1{font-size:24px}}
@media (prefers-reduced-motion:no-preference){.btn,.chip,nav button{transition:background .15s,color .15s}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><span class="mark" aria-hidden="true">FS</span><div><b>Faybi SN</b><small>Pour les freelances</small></div></div>
    <nav id="nav" aria-label="Navigation">
      <button data-act="go" data-view="dash">Accueil</button>
      <button data-act="go" data-view="docs">Factures et devis</button>
      <button data-act="go" data-view="clients">Clients</button>
      <button data-act="go" data-view="catalog">Mes tarifs</button>
      <button data-act="go" data-view="expenses">Dépenses</button>
      <button data-act="go" data-view="tax" id="nav-tax">TVA</button>
      <button data-act="go" data-view="settings">Mon profil</button>
    </nav>
    <div class="side-cta">
      <button class="btn primary" data-act="new" data-type="FAC">+ Nouvelle facture</button>
      <button class="btn alt" data-act="new" data-type="DEV">+ Nouveau devis</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
const KEY = 'facturesn.freelance.v1';
const TVA = 0.18;
const EUR_XOF = 655.957; // parité fixe du franc CFA avec l'euro
const METHODS = ['Wave', 'Orange Money', 'Free Money', 'Virement', 'Espèces', 'Chèque'];
const CATS = ['Logiciels et abonnements', 'Matériel', 'Internet et téléphone', 'Coworking', 'Transport', 'Formation', 'Sous-traitance', 'Publicité', 'Autre'];
const ACCOUNT = {'Wave': 'Wave', 'Orange Money': 'Orange Money', 'Free Money': 'Free Money', 'Virement': 'Banque', 'Chèque': 'Banque', 'Espèces': 'Espèces'};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('fr-FR', {maximumFractionDigits: 0});
const nf2 = new Intl.NumberFormat('fr-FR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const num = n => nf.format(Math.round(n || 0));
const money = n => num(n) + ' FCFA';
const isEur = d => d.cur === 'EUR';
const rnd = (d, n) => isEur(d) ? Math.round(n * 100) / 100 : Math.round(n);
const amt = (d, n) => isEur(d) ? nf2.format(n || 0) + ' €' : money(n);            // montant dans la devise du document

/* ---------- Montant en lettres (« Arrêtée la présente facture à la somme de… ») ---------- */
const U = ['', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf', 'dix', 'onze', 'douze', 'treize', 'quatorze', 'quinze', 'seize', 'dix-sept', 'dix-huit', 'dix-neuf'];
const D = ['', 'dix', 'vingt', 'trente', 'quarante', 'cinquante', 'soixante'];
function under100(n, final) {
  if (n < 20) return U[n];
  const t = Math.floor(n / 10), u = n % 10;
  if (t === 7) return n === 71 ? 'soixante et onze' : 'soixante-' + U[n - 60];
  if (t === 9) return 'quatre-vingt-' + U[n - 80];
  if (t === 8) return u === 0 ? (final ? 'quatre-vingts' : 'quatre-vingt') : 'quatre-vingt-' + U[u];
  if (u === 0) return D[t];
  return D[t] + (u === 1 ? ' et un' : '-' + U[u]);
}
function under1000(n, final) {
  const h = Math.floor(n / 100), r = n % 100;
  let s = '';
  if (h) s = h === 1 ? 'cent' : U[h] + ' cent' + (r === 0 && final ? 's' : '');
  if (r) s += (s ? ' ' : '') + under100(r, final);
  return s;
}
function enLettres(n) {
  if (n === 0) return 'zéro';
  const mrd = Math.floor(n / 1e9), mio = Math.floor(n / 1e6) % 1000, k = Math.floor(n / 1000) % 1000, r = n % 1000, p = [];
  if (mrd) p.push(under1000(mrd, true) + ' milliard' + (mrd > 1 ? 's' : ''));
  if (mio) p.push(under1000(mio, true) + ' million' + (mio > 1 ? 's' : ''));
  if (k) p.push(k === 1 ? 'mille' : under1000(k, false) + ' mille');
  if (r) p.push(under1000(r, true));
  return p.join(' ');
}
function sommeEnLettres(n, cur) {
  const ent = Math.floor(n + 1e-9), cts = Math.round((n - ent) * 100);
  const round = ent >= 1e6 && ent % 1e6 === 0; // « un million de francs », « deux millions d’euros »
  let s = enLettres(ent);
  if (cur === 'EUR') {
    s += round ? ' d’euros' : ent > 1 ? ' euros' : ' euro';
    if (cts) s += ' et ' + enLettres(cts) + (cts > 1 ? ' centimes' : ' centime');
  } else s += round ? ' de francs CFA' : ent > 1 ? ' francs CFA' : ' franc CFA';
  return cap(s);
}

/* ---------- Calculs ---------- */
function totals(d) {
  const brut = rnd(d, d.lines.reduce((a, l) => a + (+l.qty || 0) * (+l.price || 0), 0));
  const remise = rnd(d, brut * (+d.discount || 0) / 100), ht = rnd(d, brut - remise);
  const tva = d.tva ? rnd(d, ht * TVA) : 0, ttc = rnd(d, ht + tva);
  const paid = rnd(d, (d.payments || []).reduce((a, p) => a + p.amount, 0));
  const deposit = rnd(d, ttc * (+d.deposit || 0) / 100);
  return {brut, remise, ht, tva, ttc, paid, deposit, reste: Math.max(0, rnd(d, ttc - paid))};
}
function nextNum(type, date, docs = S.docs) {
  const y = date.slice(0, 4), pre = `${type}-${y}-`;
  const n = docs.filter(d => d.num.startsWith(pre)).reduce((m, d) => Math.max(m, +d.num.slice(pre.length) || 0), 0) + 1;
  return pre + String(n).padStart(4, '0');
}
function st(d) {
  if (d.type === 'DEV') return d.convertedTo ? 'converti' : 'devis';
  const t = totals(d);
  if (t.reste <= 0) return 'payee';
  if (d.due && d.due < today()) return 'retard';
  if (t.paid > 0) return d.deposit && t.paid >= t.deposit ? 'acompte' : 'partielle';
  return 'attente';
}

    <div class="grid2">
      ${list.length ? `<div class="tablewrap"><table class="list"><thead><tr><th>Date</th><th>Libellé</th><th class="hide-sm">Payé avec</th><th class="num">Montant</th></tr></thead>
        <tbody>${list.map(x => `<tr data-act="expEdit" data-id="${x.id}" tabindex="0"><td style="white-space:nowrap">${fmtDate(x.date)}</td>
          <td><b>${esc(x.desc)}</b>${x.photo ? ' <span class="pill muted">Reçu</span>' : ''}<br><small class="muted">${esc(x.category)}${x.supplier ? ' · ' + esc(x.supplier) : ''}</small></td>
          <td class="hide-sm">${esc(x.method)}</td><td class="num">${num(x.amount)}</td></tr>`).join('')}</tbody></table></div>`
        : `<div class="card empty"><p>Notez vos dépenses pour connaître ce que vous gagnez vraiment.</p><button class="btn primary" data-act="expNew">+ Nouvelle dépense</button></div>`}
      <section class="card"><h2>Par catégorie, ce mois</h2>
        ${byCat.length ? `<div class="cats">${byCat.map(([c, v]) => `<div class="cat"><span>${esc(c)}</span><span class="track"><i style="width:${v / maxC * 100}%"></i></span><span class="num">${num(v)}</span></div>`).join('')}</div>`
          : `<p class="empty">Aucune dépense ce mois-ci.</p>`}
      </section>
    </div>
  </div>`;
}
function readExp() {
  const e = ui.expDraft; if (!$('#expform')) return;
  e.desc = $('#e-desc').value.trim(); e.supplier = $('#e-supplier').value.trim(); e.category = $('#e-cat').value;
  e.amount = Math.round(parseNum($('#e-amount').value)); e.method = $('#e-method').value; e.date = $('#e-date').value || today();
  e.tva = !!$('#e-tva')?.checked;
}

function vTax() {
  if (!S.company.tvaOn) return `<div class="head"><div><h1>TVA</h1><p>Vous n’êtes pas assujetti à la TVA.</p></div></div>
    <div class="card stack" style="gap:12px"><p style="margin:0">Beaucoup de freelances qui démarrent ne facturent pas la TVA. Si vous y êtes assujetti, activez-la dans votre profil : vos factures, vos dépenses et votre calendrier de déclaration s’adapteront.</p>
    <div><button class="btn" data-act="go" data-view="settings">Ouvrir mon profil</button></div></div>`;
  const T = today(), [yy, mm] = T.slice(0, 7).split('-').map(Number);
  const rows = [];
  for (let i = 5; i >= 0; i--) {
    const dt = new Date(Date.UTC(yy, mm - 1 - i, 1)), key = dt.toISOString().slice(0, 7);
    rows.push({key, label: dt.toLocaleDateString('fr-FR', {month: 'long', year: 'numeric', timeZone: 'UTC'}), ...monthTax(key)});
  }
  // La TVA d'un mois se déclare avant le 15 du mois suivant
  const dl = [-1, 0].map(i => {
    const due = new Date(Date.UTC(yy, mm + i, 15)).toISOString().slice(0, 10), per = new Date(Date.UTC(yy, mm - 1 + i, 1));
    return {due, key: per.toISOString().slice(0, 7), label: per.toLocaleDateString('fr-FR', {month: 'long', timeZone: 'UTC'}), current: i === 0};
  }).filter(x => x.due >= T);
  const when = due => { const n = daysBetween(T, due); return n === 0 ? 'aujourd’hui' : `dans ${n} jour${n > 1 ? 's' : ''}`; };
  return `<div class="head"><div><h1>TVA</h1><p>Calculée à partir de vos factures et de vos dépenses.</p></div></div>
  <div class="stack">
    <section class="card"><h2>Prochaines déclarations</h2>
      ${dl.map(x => { const t = monthTax(x.key), dd = new Date(x.due + 'T00:00:00Z'); return `<div class="deadline">
        <div class="day"><b>${dd.getUTCDate()}</b><small>${esc(dd.toLocaleDateString('fr-FR', {month: 'short', timeZone: 'UTC'}))}</small></div>
        <div><b>TVA de ${esc(x.label)}</b> · ${when(x.due)}<br><span class="muted">Collectée ${money(t.coll)} · déductible ${money(t.ded)}</span><br>
        ${t.net >= 0 ? `À payer : <b class="mono">${money(t.net)}</b>` : `Crédit de TVA : <b class="mono">${money(-t.net)}</b>`}${x.current ? ' <span class="pill muted">estimation, mois en cours</span>' : ''}</div></div>`; }).join('')}
      <p class="note">Calendrier indicatif. Faites confirmer vos obligations par un comptable ou par la DGID.</p>
    </section>
    <div class="tablewrap"><table class="list"><thead><tr><th>Mois</th><th class="num">Collectée</th><th class="num">Déductible</th><th class="num">Net</th></tr></thead>
      <tbody>${rows.reverse().map(r => `<tr><td>${esc(cap(r.label))}</td><td class="num">${num(r.coll)}</td><td class="num">${num(r.ded)}</td>
        <td class="num" style="font-weight:600">${r.net < 0 ? 'Crédit ' + num(-r.net) : num(r.net)}</td></tr>`).join('')}</tbody></table></div>
  </div>`;
}

function vSettings() {
  const co = S.company;
  const f = (k, l, ph = '') => `<label class="field">${l}<input type="text" id="s-${k}" value="${esc(co[k])}" placeholder="${ph}"></label>`;
  return `<div class="head"><div><h1>Mon profil</h1><p>Ces informations apparaissent sur vos devis et factures.</p></div></div>
  <div class="stack">
    <form id="setform" class="card stack">
      <div class="fgrid">${f('name', 'Votre nom ou nom de marque', 'Ex. : Khady Sy')}${f('job', 'Votre métier', 'Ex. : Développeur web')}
        ${f('phone', 'Téléphone Wave / Orange Money', '+221 77 000 00 00')}${f('email', 'E-mail')}${f('address', 'Ville ou quartier', 'Ex. : Liberté 6, Dakar')}${f('ninea', 'NINEA (facultatif)')}
        <label class="field">Objectif de revenus par mois (FCFA)<input type="text" id="s-goal" inputmode="numeric" value="${co.goal || ''}" placeholder="Ex. : 1 000 000"></label></div>
      <label class="check"><input type="checkbox" id="s-tvaOn" ${co.tvaOn ? 'checked' : ''}> Je suis assujetti à la TVA (18 %)</label>
      <label class="field">Conditions en bas de vos documents<textarea id="s-mentions">${esc(co.mentions)}</textarea></label>
      <div class="row"><button type="submit" class="btn primary">Enregistrer</button></div>
    </form>
    <section class="card stack" style="gap:12px"><h2 style="margin:0">Données</h2>
      <p class="muted" style="margin:0">Dans ce prototype, vos données sont gardées dans ce navigateur uniquement. La version finale les enregistrera sur un serveur sécurisé.</p>
      ${ui.confirm === 'wipe' ? `<div class="panel alert"><b>Effacer toutes les factures, devis, clients et dépenses ?</b><div class="row"><button class="btn danger solid" data-act="wipe">Oui, tout effacer</button><button class="btn" data-act="cancelConfirm">Annuler</button></div></div>` : ''}
      <div class="row"><button class="btn" data-act="demo">Recharger les exemples</button><button class="btn danger" data-act="askWipe">Repartir de zéro</button></div>
    </section>
  </div>`;
}

/* ---------- Rendu et actions ---------- */
function render(scroll) {
  $('#main').innerHTML = views[ui.view]();
  const nav = {dash: 'dash', docs: 'docs', doc: 'docs', edit: 'docs', clients: 'clients', client: 'clients', settings: 'settings', expenses: 'expenses', catalog: 'catalog', tax: 'tax'}[ui.view];
  document.querySelectorAll('#nav button').forEach(b => b.dataset.view === nav ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  $('#nav-tax').hidden = !S.company.tvaOn;
  if (scroll) window.scrollTo(0, 0);
}
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2400); }
function go(view, extra = {}) { Object.assign(ui, {view, err: '', pay: false, relance: false, confirm: null, expDraft: null, catDraft: null}, extra); render(true); }
function persist(msg) { const ok = save(); if (msg) toast(ok ? msg : msg + ' (non sauvegardé : stockage du navigateur indisponible ou plein)'); }
const cell = v => String(v ?? '').replace(/[\t\n]/g, ' ');
function copyText(text, ok) {
  navigator.clipboard.writeText(text).then(() => toast(ok)).catch(() => toast('Cette fenêtre bloque la copie. Ouvrez le prototype dans un navigateur pour copier.'));
}

function startDraft(type, clientId) {
  const T = today(), c = client(clientId);
  ui.draft = {id: null, type, num: '', clientId: clientId || '', cur: c && /^\+(?!221)/.test(c.phone || '') ? 'EUR' : 'XOF', date: T, due: addDays(T, type === 'DEV' ? 30 : 15),
    tva: S.company.tvaOn, discount: 0, deposit: type === 'DEV' ? 50 : 0, lines: [{desc: '', qty: 1, price: 0}], notes: '', payments: []};
  go('edit');
}
function readDraft() {
  const d = ui.draft; if (!$('#editor')) return;
  if (!d.id) d.type = $('#f-type').value;
  d.clientId = $('#f-client').value; d.cur = $('#f-cur').value; d.date = $('#f-date').value || today(); d.due = $('#f-due').value;
  d.tva = S.company.tvaOn && !!$('#f-tva')?.checked; d.notes = $('#f-notes').value;
  d.deposit = +$('#f-dep').value || 0;
  d.discount = Math.min(100, Math.max(0, parseNum($('#f-disc').value)));
  document.querySelectorAll('[data-line]').forEach(el => {
    const l = d.lines[+el.dataset.line], k = el.dataset.field;
    l[k] = k === 'desc' ? el.value : parseNum(el.value);
  });
}

const acts = {
  go: el => go(el.dataset.view),
  new: el => startDraft(el.dataset.type, el.dataset.client),
  open: (el, e) => { e.preventDefault(); go('doc', {id: el.dataset.id}); },
  filter: el => { ui.filter = el.dataset.f; render(); },
  remind: el => go('doc', {id: el.dataset.id, relance: 'remind'}),
  addLine: () => { readDraft(); ui.draft.lines.push({desc: '', qty: 1, price: 0}); render(); $(`#l-${ui.draft.lines.length - 1}-desc`)?.focus(); },
  delLine: el => { readDraft(); ui.draft.lines.splice(+el.dataset.i, 1); if (!ui.draft.lines.length) ui.draft.lines.push({desc: '', qty: 1, price: 0}); render(); },
  cancelEdit: () => ui.draft?.id ? go('doc', {id: ui.draft.id}) : go('docs'),
  edit: () => { ui.draft = JSON.parse(JSON.stringify(S.docs.find(x => x.id === ui.id))); go('edit'); },
  dup: () => {
    const src = S.docs.find(x => x.id === ui.id), T = today();
    ui.draft = {...JSON.parse(JSON.stringify(src)), id: null, num: '', date: T, due: addDays(T, 15), payments: [], convertedTo: undefined};
    go('edit');
  },
  convert: () => {
    const dv = S.docs.find(x => x.id === ui.id), T = today();
    const f = {id: uid(), type: 'FAC', num: nextNum('FAC', T), clientId: dv.clientId, cur: dv.cur, date: T, due: addDays(T, 15), tva: dv.tva,
      discount: dv.discount, deposit: dv.deposit, lines: JSON.parse(JSON.stringify(dv.lines)), notes: dv.notes, payments: []};
    S.docs.push(f); dv.convertedTo = f.id; persist(`Facture ${f.num} créée à partir du devis`); go('doc', {id: f.id});
  },
  payToggle: () => { ui.pay = !ui.pay; ui.relance = false; ui.err = ''; render(); if (ui.pay) $('#p-amount')?.focus(); },
  share: el => { ui.relance = el.dataset.mode; ui.pay = false; render(); },
  closeShare: () => { ui.relance = false; render(); },
  copy: () => {
    const ta = $('#relmsg');
    navigator.clipboard.writeText(ta.value).then(() => toast('Message copié')).catch(() => { ta.select(); toast('Texte sélectionné : copiez-le avec Ctrl+C'); });
  },
  askDel: () => { ui.confirm = 'del'; render(); },
  cancelConfirm: () => { ui.confirm = null; render(); },
  del: () => {
    const d = S.docs.find(x => x.id === ui.id);
    S.docs = S.docs.filter(x => x.id !== ui.id);
    S.docs.forEach(x => { if (x.convertedTo === ui.id) delete x.convertedTo; });
    persist(`${d.num} supprimé`); go('docs');
  },
  clientNew: el => { if (el.dataset.back === 'edit') readDraft(); ui.back = el.dataset.back || null; ui.clientDraft = {id: null, name: '', contact: '', phone: '', email: '', address: '', ninea: ''}; go('client'); },
  clientEdit: el => { ui.back = null; ui.clientDraft = {...client(el.dataset.id)}; go('client'); },
  clientCancel: () => ui.back === 'edit' ? go('edit') : go('clients'),
  clientAskDel: () => {
    if (S.docs.some(d => d.clientId === ui.clientDraft.id)) { toast('Ce client a des documents : il ne peut pas être supprimé.'); return; }
    ui.confirm = 'cdel'; render();
  },
  clientDel: () => { S.clients = S.clients.filter(c => c.id !== ui.clientDraft.id); persist('Client supprimé'); go('clients'); },
  expNew: () => { ui.expDraft = {id: null, date: today(), desc: '', supplier: '', category: CATS[0], amount: 0, method: 'Wave', tva: false, photo: ''}; ui.err = ''; render(true); $('#e-desc')?.focus(); },
  expEdit: el => { ui.expDraft = {...S.expenses.find(x => x.id === el.dataset.id)}; ui.err = ''; render(true); },
  expCancel: () => { ui.expDraft = null; ui.err = ''; render(); },
  expDel: () => { S.expenses = S.expenses.filter(x => x.id !== ui.expDraft.id); ui.expDraft = null; persist('Dépense supprimée'); render(); },
  expPhotoDel: () => { readExp(); ui.expDraft.photo = ''; render(); },
  exportExp: () => {
    const rows = [['Date', 'Libellé', 'Fournisseur', 'Catégorie', 'Payé avec', 'Montant (FCFA)']]
      .concat([...S.expenses].sort((a, b) => a.date.localeCompare(b.date)).map(e => [e.date, e.desc, e.supplier, e.category, e.method, e.amount]));
    copyText(rows.map(r => r.map(cell).join('\t')).join('\n'), 'Dépenses copiées : collez-les dans Excel ou Google Sheets');
  },
  exportDocs: () => {
    const rows = [['N°', 'Type', 'Client', 'Devise', 'Date', 'Échéance', 'Total', 'Payé', 'Reste', 'Statut']]
      .concat([...S.docs].sort((a, b) => a.date.localeCompare(b.date)).map(d => { const t = totals(d); return [d.num, d.type === 'DEV' ? 'Devis' : 'Facture', cName(d.clientId), isEur(d) ? 'EUR' : 'FCFA', d.date, d.due, t.ttc, t.paid, t.reste, ST[st(d)][0]]; }));
    copyText(rows.map(r => r.map(cell).join('\t')).join('\n'), 'Tableau copié : collez-le dans Excel ou Google Sheets');
  },
  catNew: () => { ui.catDraft = {id: null, name: '', unit: '', price: 0}; ui.err = ''; render(true); $('#g-name')?.focus(); },
  catEdit: el => { ui.catDraft = {...S.catalog.find(x => x.id === el.dataset.id)}; ui.err = ''; render(true); },
  catCancel: () => { ui.catDraft = null; ui.err = ''; render(); },
  catDel: () => { S.catalog = S.catalog.filter(x => x.id !== ui.catDraft.id); ui.catDraft = null; persist('Prestation supprimée'); render(); },
  demo: () => { S = seed(); persist('Exemples rechargés'); go('dash'); },
  askWipe: () => { ui.confirm = 'wipe'; render(); },
  wipe: () => { S = blank(); persist('Toutes les données ont été effacées'); go('settings'); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && acts[el.dataset.act]) acts[el.dataset.act](el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('tr[data-act]')) e.target.click();
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { ui.q = e.target.value; $('#doclist').innerHTML = docList(); return; }
  if (e.target.closest('#editor')) {
    readDraft();
    if (e.target.id === 'f-type' || e.target.id === 'f-cur') { render(); return; }
    if (e.target.dataset.field === 'desc' && !isEur(ui.draft)) {
      const i = +e.target.dataset.line, l = ui.draft.lines[i], it = S.catalog.find(c => c.name === l.desc);
      if (it && !l.price) { l.price = it.price; const p = $(`#l-${i}-price`); if (p) p.value = it.price; }
    }
    const d = ui.draft;
    d.lines.forEach((l, i) => { const a = $(`[data-amt="${i}"]`); if (a) a.textContent = amtShort(d, rnd(d, l.qty * l.price)); });
    $('#totals').innerHTML = totalsBox(d);
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === 'editor') {
    readDraft();
    const d = ui.draft;
    d.lines = d.lines.filter(l => l.desc.trim() || l.price > 0);
    if (!d.lines.length) d.lines = [{desc: '', qty: 1, price: 0}];
    if (!d.clientId) { ui.err = 'Choisissez un client, ou ajoutez-en un.'; return render(true); }
    if (d.lines.some(l => !l.desc.trim())) { ui.err = 'Chaque ligne doit avoir une prestation.'; return render(true); }
    if (totals(d).ttc <= 0) { ui.err = 'Ajoutez au moins une ligne avec un prix.'; return render(true); }
    if (d.id) S.docs = S.docs.map(x => x.id === d.id ? d : x);
    else { d.id = uid(); d.num = nextNum(d.type, d.date); S.docs.push(d); }
    persist(`${d.num} enregistré`); go('doc', {id: d.id});
  }
  if (id === 'payform') {
    const d = S.docs.find(x => x.id === ui.id), amount = rnd(d, parseNum($('#p-amount').value)), reste = totals(d).reste;
    if (amount <= 0) { ui.err = 'Indiquez un montant supérieur à zéro.'; return render(); }
    if (amount > reste) { ui.err = `Le montant dépasse le reste à payer (${amt(d, reste)}).`; return render(); }
    d.payments.push({date: $('#p-date').value || today(), amount, method: $('#p-method').value});
    persist(totals(d).reste === 0 ? `${d.num} est entièrement payée` : `Paiement de ${amt(d, amount)} enregistré`);
    go('doc', {id: d.id});
  }
  if (id === 'clientform') {
    const c = ui.clientDraft;
    ['name', 'contact', 'phone', 'email', 'address', 'ninea'].forEach(k => c[k] = $('#k-' + k).value.trim());
    if (!c.name) { ui.err = 'Le nom du client est obligatoire.'; return render(); }
    if (c.id) S.clients = S.clients.map(x => x.id === c.id ? c : x);
    else { c.id = uid(); S.clients.push(c); }
    persist('Client enregistré');
    if (ui.back === 'edit') { ui.draft.clientId = c.id; ui.back = null; go('edit'); } else go('clients');
  }
  if (id === 'expform') {
    readExp();
    const x = ui.expDraft;
    if (!x.desc) { ui.err = 'Indiquez un libellé.'; return render(); }
    if (x.amount <= 0) { ui.err = 'Indiquez un montant supérieur à zéro.'; return render(); }
    if (x.id) S.expenses = S.expenses.map(y => y.id === x.id ? x : y);
    else { x.id = uid(); S.expenses.push(x); }
    ui.expDraft = null; ui.err = '';
    persist('Dépense enregistrée'); render();
  }
  if (id === 'catform') {
    const c = ui.catDraft;
    c.name = $('#g-name').value.trim(); c.unit = $('#g-unit').value.trim(); c.price = Math.round(parseNum($('#g-price').value));
    if (!c.name) { ui.err = 'Le nom de la prestation est obligatoire.'; return render(); }
    if (c.id) S.catalog = S.catalog.map(y => y.id === c.id ? c : y);
    else { c.id = uid(); S.catalog.push(c); }
    ui.catDraft = null; ui.err = '';
    persist('Prestation enregistrée'); render();
  }
  if (id === 'setform') {
    ['name', 'job', 'phone', 'email', 'address', 'ninea', 'mentions'].forEach(k => S.company[k] = $('#s-' + k).value.trim());
    S.company.goal = Math.round(parseNum($('#s-goal').value));
    S.company.tvaOn = $('#s-tvaOn').checked;
    S.demo = false;
    persist('Profil enregistré'); render();
  }
});

// Photo du reçu : réduite avant d'être gardée, pour ne pas saturer le stockage
document.addEventListener('change', e => {
  if (e.target.id !== 'e-photo' || !e.target.files[0]) return;
  readExp();
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 900 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      ui.expDraft.photo = c.toDataURL('image/jpeg', 0.6); render();
    };
    img.onerror = () => toast('Image illisible. Essayez une photo JPG ou PNG.');
    img.src = r.result;
  };
  r.readAsDataURL(e.target.files[0]);
});

render();
</script>
